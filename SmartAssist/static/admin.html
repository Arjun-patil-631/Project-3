<!doctype html>
<html><head><meta charset="utf-8"><title>SmartAssist Admin</title><link rel="stylesheet" href="/static/style.css"></head>
<body><div class="app"><header><h1>🛠 SmartAssist Admin</h1><a href="/">Chat</a></header>
<main>
<h2>Knowledge Base</h2>
<div id="articles"></div>
<hr>
<h2>Add Article</h2>
<input id="filename" placeholder="article_name">
<textarea id="content" rows="12" style="width:100%;margin:12px 0;padding:12px" placeholder="# Article title&#10;&#10;Question: ...&#10;Answer: ..."></textarea>
<button onclick="addArticle()">Add / Update Article</button>
<h2>Recent Conversations</h2><pre id="logs"></pre>
</main></div>
<script>
async function load(){
 const k=await (await fetch("/admin/knowledge")).json();
 document.getElementById("articles").innerHTML=k.articles.map(a=>`<div class="bubble assistant"><b>${a.filename}</b></div>`).join("");
 const c=await (await fetch("/admin/conversations")).json();
 document.getElementById("logs").textContent=JSON.stringify(c.rows,null,2);
}
async function addArticle(){
 await fetch("/admin/knowledge",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({filename:document.getElementById("filename").value,content:document.getElementById("content").value})});
 alert("Knowledge base updated"); load();
}
load();
</script></body></html>
